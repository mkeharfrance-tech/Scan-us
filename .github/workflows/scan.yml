name: scan-us
on:
  push:
    paths:
      - ".github/workflows/scan.yml"
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Telecharger le scanner d'origine (version relue)
        run: |
          mkdir -p scanner
          curl -fsSL https://raw.githubusercontent.com/Jakeschincariol/day-trader-skill/3d0f4ef6986f4984b7c6bd46f7ff4f87744c3abd/trader-scanner/scan.py -o scanner/scan.py
      - name: Scanner
        run: |
          python3 scanner/scan.py universe
          python3 scanner/scan.py daily --min-price 5 --min-volume 1000000 --show 100 | tee scan.log
      - name: Enrichir (VIX et niveaux)
        continue-on-error: true
        run: |
          cat > enrich.py <<'PYEOF'
          import json, time, urllib.request, urllib.parse, os

          def get(sym):
              u = "https://query1.finance.yahoo.com/v8/finance/chart/" + urllib.parse.quote(sym) + "?range=3mo&interval=1d"
              req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"})
              d = json.load(urllib.request.urlopen(req, timeout=20))
              r = d["chart"]["result"][0]
              off = r["meta"].get("gmtoffset", 0)
              q = r["indicators"]["quote"][0]
              rows = []
              for i, t in enumerate(r["timestamp"]):
                  c, h, l, v = q["close"][i], q["high"][i], q["low"][i], q["volume"][i]
                  if c is None or h is None or l is None:
                      continue
                  rows.append((time.strftime("%Y-%m-%d", time.gmtime(t + off)), h, l, c, v or 0))
              return rows

          def atr14(rows):
              trs = []
              for i in range(1, len(rows)):
                  _, h, l, c, _ = rows[i]
                  pc = rows[i - 1][3]
                  trs.append(max(h - l, abs(h - pc), abs(l - pc)))
              if len(trs) < 14:
                  return None
              a = sum(trs[:14]) / 14
              for tr in trs[14:]:
                  a = (a * 13 + tr) / 14
              return a

          def main():
              os.makedirs("data", exist_ok=True)
              wl = json.load(open("trader/watchlist.json"))
              # VIX
              try:
                  rows = get("^VIX")[-35:]
                  json.dump({"source": "yahoo ^VIX", "as_of": wl.get("as_of"),
                             "closes": [{"date": r[0], "close": round(r[3], 2)} for r in rows]},
                            open("data/vix.json", "w"))
                  print("VIX ok", rows[-1][0], rows[-1][3])
              except Exception as e:
                  print("VIX echec", e)
              # Niveaux des 120 premiers hits
              out = {}
              for h in wl.get("hits", [])[:120]:
                  s = h["symbol"]
                  try:
                      rows = get(s.replace(".", "-"))
                      if len(rows) < 16:
                          continue
                      last, prev = rows[-1], rows[-2]
                      a = atr14(rows)
                      vols = [r[4] for r in rows[-20:]]
                      out[s] = {"date": last[0], "high": round(last[1], 2), "low": round(last[2], 2),
                                "close": round(last[3], 2), "prev_low": round(prev[2], 2),
                                "atr14": round(a, 2) if a else None,
                                "avg_vol20": int(sum(vols) / len(vols))}
                  except Exception as e:
                      print("niveaux echec", s, e)
                  time.sleep(0.15)
              json.dump({"as_of": wl.get("as_of"), "levels": out}, open("data/levels.json", "w"))
              print("niveaux", len(out))

          if __name__ == "__main__":
              main()
          PYEOF
          python3 enrich.py | tee -a scan.log
      - name: Publier
        run: |
          mkdir -p data
          cp trader/watchlist.json data/watchlist.json
          cp scan.log data/scan.log
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add data
          git commit -m "scan $(date -u +%F)" || echo "rien de nouveau"
          git push
